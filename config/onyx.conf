# Onyx XFCE — ajustes de usuario
# Este archivo lo leen los scripts de los módulos en cada actualización.
# Tras editarlo no hace falta reiniciar: los módulos lo releen solos.
# install.sh nunca sobrescribe este archivo si ya existe.

# --- Clima (Open-Meteo, sin clave de API) -----------------------------------
ONYX_WEATHER_PLACE="Santa Cruz de la Sierra"
ONYX_WEATHER_LAT="-17.7833"
ONYX_WEATHER_LON="-63.1821"
ONYX_WEATHER_TTL=2700          # segundos que dura la caché (45 min)

# --- Temperatura interna -----------------------------------------------------
# auto | k10temp | amdgpu | acpitz | ruta a un archivo temp*_input
ONYX_TEMP_SENSOR=auto
ONYX_TEMP_WARN=70              # °C: texto resaltado
ONYX_TEMP_CRIT=80              # °C: módulo invertido (blanco sobre negro)

# --- Brillo ------------------------------------------------------------------
# auto o el nombre de un dispositivo de /sys/class/backlight (p. ej. amdgpu_bl0)
ONYX_BACKLIGHT=auto
ONYX_BRIGHTNESS_MIN=5          # % mínimo del control, evita apagar la pantalla

# --- Música (MPRIS) ----------------------------------------------------------
ONYX_MUSIC_MAX=28              # caracteres máximos del título
ONYX_MUSIC_IGNORE=""           # reproductores a ignorar, separados por comas

# --- Reloj -------------------------------------------------------------------
ONYX_CLOCK_LOCALE=C            # C = "Oct 26"; es_BO.UTF-8 = "oct 26"
ONYX_CLOCK_AMPM=full           # full = "4:27 PM"; short = "4:27 P"
